name: Baluchon

options:
  bundleIdPrefix: app.baluchon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Baluchon:
    type: application
    platform: iOS
    sources:
      - path: Baluchon
      - path: Shared
    info:
      path: Baluchon/Info.plist
      properties:
        CFBundleDisplayName: Baluchon
        CFBundleDevelopmentRegion: fr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: "Baluchon analyse les photos et captures d'écran que tu choisis pour trouver des idées de voyage."
        LSApplicationQueriesSchemes:
          - comgooglemaps
    entitlements:
      path: Baluchon/Baluchon.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.baluchon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.baluchon.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: BaluchonShare

  BaluchonShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Baluchon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/BaluchonShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.baluchon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.baluchon.ios.share

  BaluchonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BaluchonTests
    dependencies:
      - target: Baluchon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.baluchon.ios.tests

schemes:
  Baluchon:
    build:
      targets:
        Baluchon: all
        BaluchonTests: [test]
    test:
      targets:
        - BaluchonTests
      gatherCoverageData: false
